            height: 0;

        let stats = {"-1": {"h": 65.5, "b": 30.3, "count": 1578}, "0": {"h": 85.0, "b": 8.3, "count": 2870}, "2": {"h": 16.7, "b": 78.5, "count": 186}, "1": {"h": 1.8, "b": 97.7, "count": 852}};
        let clusterColors = {};
        let isPanelVisible = true;
        
        // Custom Palette
        const palette = [
            '#E63946', // Primary (Red)
            '#03A6A1', // Mauk (Cyan)
            '#E63946', // Abaci (Orange)
            '#FF9D23', // Secondary Cyan
            '#457B9D', // Dark Blue
            '#9B59B6', // Purple
            '#F1FAEE'  // Near White
        ];

        function togglePanel() {
            isPanelVisible = !isPanelVisible;
            const panel = document.getElementById('main-panel');
            const btn = document.getElementById('toggle-btn');
            if (isPanelVisible) {
                panel.classList.remove('collapsed');
                btn.innerText = '−';
                btn.style.transform = 'rotate(0deg)';
            } else {
                panel.classList.add('collapsed');
                btn.innerText = '+';
                btn.style.transform = 'rotate(180deg)';
            }
        }

        function setup() {
            createCanvas(windowWidth, windowHeight, WEBGL);
            
            // Assign colors
            let clusters = Object.keys(stats).map(Number).sort((a,b) => a-b);
            clusters.forEach((c, i) => {
                if (c === -1) {
                    clusterColors[c] = '#3d3d42'; // Dark gray for noise
                } else {
                    clusterColors[c] = palette[i % palette.length];
                }
            });

            // Build legend
            const list = document.getElementById('cluster-list');
            clusters.forEach(c => {
                const div = document.createElement('div');
                div.className = 'item';
                const col = clusterColors[c];
                const s = stats[c];
                
                const label = c === -1 ? 'Noise' : 'Cluster ' + c;
                
                div.innerHTML = `
                    <div class="color-dot" style="background:${col};"></div>
                    <span style="display:flex; align-items:baseline; gap:8px;">
                        ${label} 
                        <span style="font-size: 0.75rem; opacity: 0.5; font-weight: 400;">(n=${s.count})</span>
                    </span>
                    <div class="stats">
                        <span class="stats-h">${s.h}%</span> | 
                        <span class="stats-b">${s.b}%</span>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function draw() {
            background(10, 10, 12);
            
            orbitControl(1.5, 1.5, 2); 
            
            rotateY(frameCount * 0.001);
            
            // Subtle ambient lighting
            ambientLight(120);
            pointLight(255, 255, 255, 0, -500, 500);

            noStroke();
            
            for (let p of data) {
                push();
                translate(p.RSN_PC1, p.SEN_PC1, p.SSN_PC1);
                
                let c = clusterColors[p.Cluster];
                if (p.Cluster === -1) {
                    fill(80, 80, 85, 40); 
                } else {
                    fill(c);
                }
                
                if (p.LikelyBot_GT === 0) {
                    sphere(3.5);
                } else if (p.LikelyBot_GT === 1) {
                    box(9);
                } else {
                    rotateX(PI);
                    cone(6, 14);
                }
                pop();
            }
